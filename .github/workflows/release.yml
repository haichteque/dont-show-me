name: Build and release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Create release & package extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build & Package extension for Chrome Web Store
        run: npm run package

      - name: Archive Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store-package
          path: package/*.zip

      - name: Setup release
        uses: softprops/action-gh-release@v2
        with:
          files: package/*.zip
